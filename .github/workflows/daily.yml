name: Daily Tigers wallpaper

on:
  schedule:
    # Hourly, round the clock. GitHub starts scheduled runs hours late (often 5-7h),
    # so a few fixed times left nothing running from evening until late morning.
    # Hourly keeps real runs spread through the night: late scores and the new day land.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render the Tigers wallpaper
        run: python render_wallpaper.py

      - name: Render the Tigers widgets
        run: python render_widgets.py

      - name: Render the weekly lookahead
        continue-on-error: true
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python render_lookahead.py

      - name: Commit if anything changed
        run: |
          git config user.name  "tigers-wallpaper-bot"
          git config user.email "actions@github.com"
          git add --force output/current.png output/widget-*.png output/lookahead.png assets/logos assets/cfb-logos assets/cache || true
          if git diff --staged --quiet; then
            echo "No change — nothing to commit."
          else
            git commit -m "Wallpaper update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
